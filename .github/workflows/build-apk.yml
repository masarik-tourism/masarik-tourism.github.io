name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  JAVA_OPTS: "-Xmx3584m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\""

jobs:
  build-apk:
    name: Build & Publish Masarik-Tourism.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Fixed Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring fixed Release Keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Restoring permanent release.keystore.base64 from repository..."
            tr -d '\n\r ' < release.keystore.base64 | base64 -d > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using repository debug.keystore.base64..."
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > release.keystore
          else
            echo "ERROR: No fixed signing keystore found in Secrets or repository!"
            exit 1
          fi
          cp release.keystore debug.keystore
          ls -lh release.keystore

      - name: Setup Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Using repository app/google-services.json"
          fi
          ls -lh app/google-services.json

      - name: Set Official Release Version 1.0.1
        run: |
          echo "VERSION_CODE=2" > version.properties
          echo "VERSION_NAME=1.0.1" >> version.properties
          echo "VERSION_CODE=2" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.1" >> "$GITHUB_ENV"
          echo "Release Version: v1.0.1 (Code: 2)"
          cat version.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Minified & Signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -x test --no-daemon --stacktrace

      - name: Prepare Output APK (Masarik-Tourism.apk)
        run: |
          mkdir -p app/build/outputs/apk/release gh-pages-apk
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 3 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          if [ "$APK_FILE" != "app/build/outputs/apk/release/Masarik-Tourism.apk" ]; then
            cp "$APK_FILE" app/build/outputs/apk/release/Masarik-Tourism.apk
          fi
          cp app/build/outputs/apk/release/Masarik-Tourism.apk gh-pages-apk/Masarik-Tourism.apk
          ls -lh app/build/outputs/apk/release/Masarik-Tourism.apk gh-pages-apk/Masarik-Tourism.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Masarik-Tourism-APK
          path: app/build/outputs/apk/release/Masarik-Tourism.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'v1.0.1' }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/Masarik-Tourism.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

          NOTES_FILE="$(mktemp)"
          cat <<'EOF' > "$NOTES_FILE"
          الإصدار الرسمي من تطبيق **مسارك للسياحة** (`v1.0.1` - Build `2`).
          - تفعيل خدمة Firebase Cloud Messaging الأصلية (`MasarikFirebaseMessagingService`) لاستقبال الإشعارات في الخلفية وحتى عند إغلاق التطبيق تماماً عبر قناة `masarik_alerts`.
          - مزامنة تلقائية لرمز الجهاز (`FCM Token`) في Firestore والربط الفوري مع سيرفر الإشعارات عبر Cloudflare Worker.
          - بناء وتوقيع تلقائي للملف الرسمي `Masarik-Tourism.apk` وتحديثه داخل نفس الإصدار (`v1.0.1`).
          EOF

          RELEASE_TITLE="مسارك للسياحة ${RELEASE_TAG}"
          ATTEMPT=1
          MAX_ATTEMPTS=3

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Publishing release ${RELEASE_TAG} (attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber && \
                 gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --latest; then
                echo "Release ${RELEASE_TAG} updated successfully."
                rm -f "$NOTES_FILE"
                exit 0
              fi
            else
              if gh release create "$RELEASE_TAG" "$APK_PATH" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --latest; then
                echo "Release ${RELEASE_TAG} created successfully."
                rm -f "$NOTES_FILE"
                exit 0
              fi
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              SLEEP_SECS=$((ATTEMPT * 5))
              echo "GitHub Release API attempt ${ATTEMPT} failed. Retrying in ${SLEEP_SECS}s..."
              sleep "$SLEEP_SECS"
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          rm -f "$NOTES_FILE"
          echo "ERROR: Failed to publish APK to GitHub Releases after ${MAX_ATTEMPTS} attempts."
          exit 1
